<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>域名与免费服务续期看板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12" x-data="domainApp()" x-init="init()">

  <!-- 顶栏 Header -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-10 px-4 py-4 mb-8">
    <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-globe text-indigo-400 text-2xl"></i>
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
          域名与服务保活看板
        </h1>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- 密码设置 -->
        <div class="relative" x-data="{ open: false }">
          <button @click="open = !open" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm flex items-center gap-2">
            <i class="fa-solid fa-key text-yellow-400"></i>
            <span x-text="authSecret ? '已设秘钥' : '设置秘钥'"></span>
          </button>
          <div x-show="open" @click.outside="open = false" class="absolute right-0 mt-2 w-64 bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-xl z-20">
            <label class="block text-xs text-slate-400 mb-1">管理密码 (默认 admin123):</label>
            <input type="password" x-model="authSecret" @change="saveSecret()" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <!-- 添加按钮 -->
        <button @click="openModal()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium flex items-center gap-2 shadow-lg shadow-indigo-600/20">
          <i class="fa-solid fa-plus"></i> 添加域名
        </button>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="max-w-6xl mx-auto px-4">
    
    <!-- 加载状态 -->
    <div x-show="loading" class="text-center py-20 text-slate-400">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-indigo-400"></i>
      <p>正在读取域名数据...</p>
    </div>

    <!-- 空数据状态 -->
    <div x-show="!loading && domains.length === 0" class="text-center py-20 bg-slate-800/40 border border-slate-800 rounded-2xl">
      <i class="fa-regular fa-folder-open text-4xl text-slate-600 mb-3"></i>
      <p class="text-slate-400 mb-4">暂无记录的域名或服务</p>
      <button @click="openModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm">立即添加第一个</button>
    </div>

    <!-- 卡片列表 -->
    <div x-show="!loading && domains.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <template x-for="(item, index) in sortedDomains" :key="index">
        <div class="bg-slate-800 border rounded-2xl p-5 flex flex-col justify-between relative overflow-hidden transition duration-200 hover:border-slate-600"
             :class="{
               'border-red-500/50 bg-red-950/10': getDaysLeft(item.expireDate) <= 15,
               'border-yellow-500/50 bg-yellow-950/10': getDaysLeft(item.expireDate) > 15 && getDaysLeft(item.expireDate) <= 30,
               'border-slate-700/80': getDaysLeft(item.expireDate) > 30
             }">
          
          <div>
            <!-- 顶部域名与类型标志 -->
            <div class="flex justify-between items-start mb-3">
              <div>
                <h3 class="font-bold text-lg text-white tracking-wide" x-text="item.domain"></h3>
                <span class="text-xs px-2 py-0.5 rounded-full mt-1 inline-block"
                      :class="item.type === 'free' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'"
                      x-text="item.type === 'free' ? '免费登录保活' : '付费续费'">
                </span>
              </div>
              
              <!-- 快捷控制入口 -->
              <div class="flex gap-1">
                <button @click="editDomain(item)" class="p-1.5 text-slate-400 hover:text-indigo-400 rounded-lg"><i class="fa-solid fa-pen-to-square"></i></button>
                <button @click="deleteDomain(item.id)" class="p-1.5 text-slate-400 hover:text-red-400 rounded-lg"><i class="fa-solid fa-trash-can"></i></button>
              </div>
            </div>

            <!-- 平台与详细说明 -->
            <div class="text-xs text-slate-400 space-y-1.5 mb-4">
              <p><i class="fa-solid fa-server w-4 text-slate-500"></i> 平台：<span class="text-slate-200 font-medium" x-text="item.platform"></span></p>
              <p><i class="fa-regular fa-clock w-4 text-slate-500"></i> 截止：<span class="text-slate-200" x-text="item.expireDate"></span> （周期: <span x-text="item.periodDays"></span>天）</p>
              <p x-show="item.note" class="text-slate-400 italic bg-slate-900/50 p-2 rounded border border-slate-800/80 mt-2" x-text="item.note"></p>
            </div>
          </div>

          <!-- 底部倒计时与操作 -->
          <div class="pt-3 border-t border-slate-700/50 flex justify-between items-center">
            <div>
              <span class="text-2xl font-black"
                    :class="{
                      'text-red-400': getDaysLeft(item.expireDate) <= 15,
                      'text-yellow-400': getDaysLeft(item.expireDate) > 15 && getDaysLeft(item.expireDate) <= 30,
                      'text-emerald-400': getDaysLeft(item.expireDate) > 30
                    }"
                    x-text="getDaysLeft(item.expireDate)"></span>
              <span class="text-xs text-slate-400"> 天后到期/需续期</span>
            </div>

            <div class="flex gap-2">
              <!-- 前往官网 -->
              <a :href="item.loginUrl" target="_blank" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs rounded-lg flex items-center gap-1 text-slate-200">
                官网 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
              <!-- 快捷重置时间（续期完成） -->
              <button @click="renewDomain(item)" class="px-3 py-1.5 bg-indigo-600/80 hover:bg-indigo-600 text-xs rounded-lg font-medium text-white shadow">
                已保活/续期
              </button>
            </div>
          </div>

        </div>
      </template>
    </div>
  </main>

  <!-- 模态框：添加 / 编辑 -->
  <div x-show="showModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl">
      <h2 class="text-lg font-bold mb-4 text-white" x-text="isEdit ? '编辑域名信息' : '添加新域名/服务'"></h2>
      
      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-slate-400 mb-1">域名 / 服务名称</label>
          <input type="text" x-model="form.domain" placeholder="如 example.eu.org" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">类型</label>
            <select x-model="form.type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-indigo-500 focus:outline-none">
              <option value="free">免费续期/登录保活</option>
              <option value="paid">付费购买续费</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">注册商 / 平台</label>
            <input type="text" x-model="form.platform" placeholder="如 Dynadot / EU.org" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-indigo-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">下次到期/保活日期</label>
            <input type="date" x-model="form.expireDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">续期周期 (天)</label>
            <input type="number" x-model.number="form.periodDays" placeholder="如 90 / 180 / 365" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-indigo-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">官网登录入口 URL</label>
          <input type="url" x-model="form.loginUrl" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-slate-400 mb-1">备注信息 (可选)</label>
          <input type="text" x-model="form.note" placeholder="如：需要每半年登录一次后台点击续期" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-indigo-500 focus:outline-none">
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-6">
        <button @click="showModal = false" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm">取消</button>
        <button @click="saveDomain()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium">保存</button>
      </div>
    </div>
  </div>

  <script>
    function domainApp() {
      return {
        domains: [],
        loading: true,
        showModal: false,
        isEdit: false,
        authSecret: localStorage.getItem('domain_auth_secret') || 'admin123',
        form: { id: '', domain: '', type: 'free', platform: '', expireDate: '', periodDays: 90, loginUrl: '', note: '' },

        async init() {
          await this.fetchDomains();
        },

        saveSecret() {
          localStorage.setItem('domain_auth_secret', this.authSecret);
          alert('秘钥已更改并保存在本地');
        },

        get sortedDomains() {
          return [...this.domains].sort((a, b) => this.getDaysLeft(a.expireDate) - this.getDaysLeft(b.expireDate));
        },

        getDaysLeft(dateStr) {
          if (!dateStr) return 0;
          const target = new Date(dateStr);
          const today = new Date();
          // 重置时间到0点进行纯日期比较
          target.setHours(0,0,0,0);
          today.setHours(0,0,0,0);
          const diff = target - today;
          return Math.ceil(diff / (1000 * 60 * 60 * 24));
        },

        async fetchDomains() {
          this.loading = true;
          try {
            const res = await fetch('/api/domains');
            if (res.ok) {
              this.domains = await res.json();
            }
          } catch (e) {
            console.error('拉取失败:', e);
          } finally {
            this.loading = false;
          }
        },

        async saveDomainsToKV() {
          try {
            const res = await fetch('/api/domains', {
              method: 'POST',
              headers: { 
                'Content-Type': 'application/json',
                'X-Custom-Auth': this.authSecret 
              },
              body: JSON.stringify(this.domains)
            });
            if (!res.ok) {
              const err = await res.json();
              alert(err.error || '保存失败');
              return false;
            }
            return true;
          } catch (e) {
            alert('请求错误，保存失败');
            return false;
          }
        },

        openModal() {
          this.isEdit = false;
          const defaultDate = new Date();
          defaultDate.setDate(defaultDate.getDate() + 90);
          this.form = {
            id: Date.now().toString(),
            domain: '',
            type: 'free',
            platform: '',
            expireDate: defaultDate.toISOString().split('T')[0],
            periodDays: 90,
            loginUrl: 'https://',
            note: ''
          };
          this.showModal = true;
        },

        editDomain(item) {
          this.isEdit = true;
          this.form = JSON.parse(JSON.stringify(item));
          this.showModal = true;
        },

        async saveDomain() {
          if (!this.form.domain || !this.form.expireDate) {
            alert('请填写域名和到期日期！');
            return;
          }

          if (this.isEdit) {
            const idx = this.domains.findIndex(d => d.id === this.form.id);
            if (idx !== -1) this.domains[idx] = { ...this.form };
          } else {
            this.domains.push({ ...this.form });
          }

          const ok = await this.saveDomainsToKV();
          if (ok) this.showModal = false;
        },

        async deleteDomain(id) {
          if (!confirm('确定要删除这个域名记录吗？')) return;
          this.domains = this.domains.filter(d => d.id !== id);
          await this.saveDomainsToKV();
        },

        // 续期/保活一键重置按钮
        async renewDomain(item) {
          const days = parseInt(item.periodDays) || 90;
          const baseDate = new Date();
          baseDate.setDate(baseDate.getDate() + days);
          item.expireDate = baseDate.toISOString().split('T')[0];

          const ok = await this.saveDomainsToKV();
          if (ok) {
            alert(`续期状态已更新！下次截止日期已设置为 ${item.expireDate} (+${days}天)`);
          }
        }
      }
    }
  </script>
</body>
</html>
